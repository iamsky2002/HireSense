spring.application.name=HireSense

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hiresense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=hiresense-dev-secret-key-min-32-chars-0123456789
app.jwt.expiration-ms=86400000
