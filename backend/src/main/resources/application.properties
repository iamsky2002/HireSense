spring.application.name=HireSense

server.port=8080

# local mysql
spring.datasource.url=jdbc:mysql://localhost:3306/hiresense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# password from env
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# jwt secret from env
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# gemini key from env, empty means ai is off
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.embedding-model=text-embedding-004
app.qdrant.url=${QDRANT_URL:http://localhost:6333}
