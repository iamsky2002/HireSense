spring.application.name=HireSense

# Backend runs on port 8080 (frontend runs on 3000)
server.port=8080

# --- Datasource: local MySQL 8.4 (schema created in Phase 2) ---
spring.datasource.url=jdbc:mysql://localhost:3306/hiresense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Root password is supplied via the DB_PASSWORD env var (never committed).
# Defaults to empty, which matches a passwordless local root.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/evolve the schema from the entities during dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# JWT secret comes from the JWT_SECRET env var, never committed to git.
# if the env var is not set the app won't start (fail-fast, intentional)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- File upload (resume PDF) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
